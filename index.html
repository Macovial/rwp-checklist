<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RWP Checklist</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232e7d32'/%3E%3Cpath d='M9 16.5l5 5 9-11' fill='none' stroke='white' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --ink:#1b1f24; --muted:#5d6670; --line:#dde1e6;
  --accent:#1f5fae; --accent-ink:#fff;
  --open:#c62828; --open-bg:#fdecec;
  --doing:#d96c00; --doing-bg:#fff2e2;
  --done:#2e7d32; --done-bg:#e8f5e9;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121417; --card:#1c1f24; --ink:#e8eaed; --muted:#9aa3ad; --line:#2e333a;
    --accent:#5b9bf0; --accent-ink:#0b1320;
    --open:#ff6b6b; --open-bg:#3a1d1f;
    --doing:#ffa94d; --doing-bg:#3a2a17;
    --done:#69c46d; --done-bg:#1b3320;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{width:100%;max-width:820px;margin:0 auto;padding:0 16px}

header{background:var(--card);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:12px;min-height:56px}
.brand{font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--done);display:inline-grid;place-items:center}
.brand i::after{content:"";width:9px;height:5px;border:solid #fff;border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) translate(1px,-1px)}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.who b{color:var(--ink)}
.btn{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.small{padding:5px 10px;font-size:13px}
@media (max-width:480px){.hi{display:none}.brand{font-size:16px}.who{gap:6px}.btn.small{padding:5px 8px}}
.btn:disabled{opacity:.55;cursor:default}

main{flex:1;padding:20px 0 32px}
.hidden{display:none!important}

/* sign in */
#signin{display:grid;place-items:center;min-height:60vh}
.signcard{position:relative;width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 22px 22px;box-shadow:var(--shadow)}
.flag{position:absolute;top:-14px;left:18px;background:var(--open);color:#fff;font-weight:700;font-size:13px;padding:4px 10px;border-radius:999px;animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){.flag{animation:none}}
.signcard h1{margin:0 0 4px;font-size:22px}
.signcard p{margin:0 0 16px;color:var(--muted);font-size:14px}
label.f{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
.inp{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.inp:focus{outline:2px solid var(--accent);outline-offset:1px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;margin:14px 0 16px;color:var(--muted)}
.err{color:var(--open);font-size:14px;min-height:20px;margin-top:10px}

/* board */
.banner{background:var(--doing-bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px;margin-bottom:14px}
.progress{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
.progress .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.progress h2{margin:0;font-size:18px}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px;display:flex}
.bar span{display:block;height:100%}
.bar .d{background:var(--done)} .bar .g{background:var(--doing)}
.muted{color:var(--muted);font-size:14px}

.task{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--open);border-radius:10px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.task.doing{border-left-color:var(--doing)}
.task.done{border-left-color:var(--done)}
.task .top{display:flex;gap:10px;align-items:flex-start}
.task .txt{flex:1;font-weight:600;word-wrap:break-word;overflow-wrap:anywhere}
.task.done .txt{color:var(--muted)}
.pill{flex:none;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.open{background:var(--open-bg);color:var(--open)}
.pill.doing{background:var(--doing-bg);color:var(--doing)}
.pill.done{background:var(--done-bg);color:var(--done)}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted);margin-top:6px}
.meta .late{color:var(--open);font-weight:700}
.tag{border:1px solid var(--line);border-radius:6px;padding:0 6px}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.panel{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:92px;border:2px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 6px;font-size:14px;font-weight:600}
.seg button[data-s=open].on{border-color:var(--open);background:var(--open-bg);color:var(--open)}
.seg button[data-s=doing].on{border-color:var(--doing);background:var(--doing-bg);color:var(--doing)}
.seg button[data-s=done].on{border-color:var(--done);background:var(--done-bg);color:var(--done)}
textarea.inp{min-height:70px;resize:vertical}
.notes{margin:10px 0 0;padding:0;list-style:none;font-size:14px}
.notes li{padding:6px 0;border-top:1px solid var(--line)}
.notes .by{font-size:12px;color:var(--muted)}
details.done-group>summary{cursor:pointer;color:var(--muted);font-weight:600;margin:18px 0 10px}
.empty{text-align:center;color:var(--muted);padding:30px 10px;background:var(--card);border:1px dashed var(--line);border-radius:12px}

/* teacher */
.tools{display:grid;gap:12px;margin-bottom:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.box h3{margin:0 0 10px;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chip{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px}
.chip.on{outline:2px solid var(--accent)}
.chip b{display:block;font-size:14px}
.chip .bar{height:6px;margin-top:6px}
.chip small{color:var(--muted);font-size:12px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters select{width:auto;flex:1;min-width:140px}
h2.owner{font-size:16px;margin:22px 0 8px;display:flex;gap:8px;align-items:baseline}

dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:20px;max-width:min(92vw,380px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog p{margin:0 0 16px}
dialog .actions{justify-content:flex-end}

#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100vw - 32px);box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:10}
#toast.bad{background:var(--open);color:#fff}

footer{border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;gap:8px;padding-top:10px;padding-bottom:14px;flex-wrap:wrap}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand"><i></i>RWP Checklist</div>
    <div class="who hidden" id="who">
      <span><span class="hi">Hi, </span><b id="whoName"></b></span>
      <button class="btn small" id="refreshBtn" type="button">Refresh</button>
      <button class="btn small" id="signoutBtn" type="button">Sign out</button>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <section id="signin">
      <form class="signcard" id="signForm" autocomplete="off">
        <span class="flag">Start here</span>
        <h1>Your checklist</h1>
        <p>Pick your name and type your passcode.</p>
        <label class="f" for="nameSel">Name</label>
        <select class="inp" id="nameSel"><option value="">Loading names…</option></select>
        <input class="inp hidden" id="nameTxt" placeholder="Type your first name" autocomplete="off">
        <label class="f" for="passIn">Passcode</label>
        <input class="inp" id="passIn" type="password" inputmode="numeric" autocomplete="off" maxlength="12">
        <label class="check"><input type="checkbox" id="rememberIn"> Remember me on this device</label>
        <button class="btn primary" style="width:100%" type="submit" id="signBtn">Open my checklist</button>
        <div class="err" id="signErr" role="alert"></div>
      </form>
    </section>

    <section id="board" class="hidden"></section>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>Changes save to the RWP sheet.</span>
    <span id="build"></span>
  </div>
</footer>

<dialog id="confirmDlg">
  <p id="confirmMsg"></p>
  <div class="actions">
    <button class="btn" type="button" id="confirmNo">Cancel</button>
    <button class="btn primary" type="button" id="confirmYes">Yes, save</button>
  </div>
</dialog>
<div id="toast" class="hidden" role="status"></div>

<script>
/* ======================= CONFIG ======================= */
// Paste the web app URL from Apps Script (Deploy > Manage deployments). Ends in /exec.
var EXEC_URL = 'PASTE_YOUR_EXEC_URL_HERE';
var BUILD = 'build 2026-09-24.1';
// Offline fallback when the script is unreachable and nothing is cached. Started empty on purpose.
var SEED = [];

/* ======================= STATE ======================= */
var LABEL = { open: 'Not Started', doing: 'In Progress', done: 'Completed' };
var creds = null;          // { person, pass, remember }
var state = null;          // last load_ reply
var ui = { open: {}, filterOwner: '', filterStatus: '', stale: false };

/* ======================= STORAGE (never throws) ======================= */
function store(kind) { try { return kind === 'local' ? window.localStorage : window.sessionStorage; } catch (e) { return null; } }
function sget(kind, k) { try { var s = store(kind); var v = s && s.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function sset(kind, k, v) { try { var s = store(kind); if (s) s.setItem(k, JSON.stringify(v)); } catch (e) {} }
function sdel(kind, k) { try { var s = store(kind); if (s) s.removeItem(k); } catch (e) {} }
function boardKey(name) { return 'rwp.board.' + String(name).toLowerCase(); }

/* ======================= JSONP ======================= */
// The page and the script live on different origins, so fetch() cannot read the reply. Keep JSONP.
function call(params) {
  return new Promise(function (resolve, reject) {
    if (!/^https:\/\/script\.google\.com\//.test(EXEC_URL)) {
      reject(new Error('The board is not connected yet (EXEC_URL is not set).')); return;
    }
    var cb = 'rwp_cb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
    var s = document.createElement('script');
    var done = false;
    var timer = setTimeout(function () { finish(); reject(new Error('No answer from the server. Check your connection.')); }, 20000);
    function finish() { done = true; clearTimeout(timer); window[cb] = function () {}; s.remove(); }
    window[cb] = function (d) {
      if (done) return;
      finish();
      if (d && d.ok) resolve(d); else reject(new Error((d && d.error) || 'Unknown error'));
    };
    var q = new URLSearchParams(params);
    q.set('callback', cb); q.set('_', Date.now());
    s.src = EXEC_URL + '?' + q.toString();
    s.onerror = function () { if (done) return; finish(); reject(new Error('Could not reach the server.')); };
    document.head.appendChild(s);
  });
}
function authed(params) {
  var p = Object.assign({ person: creds.person, pass: creds.pass }, params);
  return call(p);
}

/* ======================= HELPERS ======================= */
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function today() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function prettyDue(s) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); if (!m) return s;
  return new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
}
var toastTimer;
function toast(msg, bad) {
  var t = $('toast'); t.textContent = msg; t.className = bad ? 'bad' : '';
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.className = 'hidden'; }, bad ? 6000 : 2500);
}
function confirmBox(msg) {
  var dlg = $('confirmDlg');
  $('confirmMsg').textContent = msg;
  return new Promise(function (resolve) {
    function close(v) { $('confirmYes').onclick = $('confirmNo').onclick = null; dlg.close(); resolve(v); }
    $('confirmYes').onclick = function () { close(true); };
    $('confirmNo').onclick = function () { close(false); };
    dlg.oncancel = function (e) { e.preventDefault(); close(false); };
    if (dlg.showModal) dlg.showModal(); else resolve(true);
  });
}
function byDueThenSort(a, b) {
  var da = a.due || '9999', db = b.due || '9999';
  if (da !== db) return da < db ? -1 : 1;
  return (a.sort || 0) - (b.sort || 0);
}
function counts(tasks) {
  var c = { open: 0, doing: 0, done: 0, total: tasks.length };
  tasks.forEach(function (t) { c[t.status]++; });
  return c;
}
function barHTML(c) {
  if (!c.total) return '<div class="bar"></div>';
  return '<div class="bar"><span class="d" style="width:' + (100 * c.done / c.total) + '%"></span>' +
         '<span class="g" style="width:' + (100 * c.doing / c.total) + '%"></span></div>';
}

/* ======================= SIGN IN ======================= */
function showSignin(msg) {
  $('signin').classList.remove('hidden');
  $('board').classList.add('hidden');
  $('who').classList.add('hidden');
  $('signErr').textContent = msg || '';
  $('passIn').value = '';
  loadRoster();
}

function loadRoster() {
  var sel = $('nameSel');
  sel.innerHTML = '<option value="">Loading names…</option>';
  call({ action: 'roster' }).then(function (d) {
    var people = d.people || [];
    if (!people.length) throw new Error('empty');
    sel.innerHTML = '<option value="">Choose your name</option>' +
      people.map(function (n) { return '<option>' + esc(n) + '</option>'; }).join('');
    sel.classList.remove('hidden'); $('nameTxt').classList.add('hidden');
  }).catch(function () {
    // Roster unreachable or empty: fall back to typing a name.
    sel.classList.add('hidden'); $('nameTxt').classList.remove('hidden');
  });
}

$('signForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var person = ($('nameSel').classList.contains('hidden') ? $('nameTxt').value : $('nameSel').value).trim();
  var pass = $('passIn').value.trim();
  if (!person) { $('signErr').textContent = 'Pick your name first.'; return; }
  if (!pass) { $('signErr').textContent = 'Type your passcode.'; return; }
  $('signBtn').disabled = true; $('signErr').textContent = '';
  creds = { person: person, pass: pass, remember: $('rememberIn').checked };
  authed({ action: 'load' }).then(function (d) {
    saveCreds();
    setState(d, false);
  }).catch(function (err) {
    creds = null;
    $('signErr').textContent = err.message;
  }).finally(function () { $('signBtn').disabled = false; });
});

function saveCreds() {
  sdel('local', 'rwp.creds'); sdel('session', 'rwp.creds');
  sset(creds.remember ? 'local' : 'session', 'rwp.creds', creds);
}

function signOut() {
  if (creds) sdel('local', boardKey(creds.person));
  sdel('local', 'rwp.creds'); sdel('session', 'rwp.creds');
  creds = null; state = null; ui = { open: {}, filterOwner: '', filterStatus: '', stale: false };
  showSignin();
}
$('signoutBtn').onclick = signOut;
$('refreshBtn').onclick = function () { refresh(true); };

/* ======================= LOAD ======================= */
function setState(d, stale) {
  state = { me: d.me, tasks: d.tasks || [], notes: d.notes || [], students: d.students || (state && state.students) || [], stamp: d.stamp };
  ui.stale = !!stale;
  if (creds && creds.remember && !stale) sset('local', boardKey(creds.person), state);
  render();
}

function refresh(announce) {
  if (!creds) return;
  return authed({ action: 'load' }).then(function (d) {
    setState(d, false);
    if (announce) toast('Up to date');
  }).catch(function (err) {
    if (/passcode|not on the list|Pick your name/i.test(err.message)) { signOut(); $('signErr').textContent = err.message; return; }
    ui.stale = true; render();
    toast('Could not refresh: ' + err.message, true);
  });
}

/* ======================= RENDER ======================= */
function render() {
  if (!state) return;
  $('signin').classList.add('hidden');
  $('board').classList.remove('hidden');
  $('who').classList.remove('hidden');
  $('whoName').textContent = state.me.name;
  var b = $('board');
  var html = ui.stale ? '<div class="banner">Showing your saved copy. Changes may not be current.</div>' : '';
  html += state.me.role === 'teacher' ? teacherHTML() : studentHTML();
  b.innerHTML = html;
  wire();
}

function notesFor(id) { return state.notes.filter(function (n) { return n.task_id === id; }); }

function taskHTML(t, showOwner) {
  var late = t.status !== 'done' && t.due && t.due < today();
  var ns = notesFor(t.id);
  var o = ui.open[t.id] || '';
  var h = '<article class="task ' + t.status + '" data-id="' + esc(t.id) + '">' +
    '<div class="top"><div class="txt">' + esc(t.task) + '</div><span class="pill ' + t.status + '">' + LABEL[t.status] + '</span></div>' +
    '<div class="meta">' +
      (showOwner ? '<span><b>' + esc(t.owner) + '</b></span>' : '') +
      (t.section && t.section !== 'General' ? '<span class="tag">' + esc(t.section) + '</span>' : '') +
      (t.due ? '<span class="' + (late ? 'late' : '') + '">' + (late ? 'Overdue · ' : 'Due ') + esc(prettyDue(t.due)) + '</span>' : '') +
      (t.updated_by ? '<span>Updated by ' + esc(t.updated_by) + (t.updated_at ? ', ' + esc(t.updated_at) : '') + '</span>' : '') +
    '</div>' +
    '<div class="actions">' +
      '<button class="btn small" data-act="panel-status" type="button">Update status</button>' +
      '<button class="btn small" data-act="panel-note" type="button">Add a note' + (ns.length ? ' (' + ns.length + ')' : '') + '</button>' +
    '</div>';
  if (o === 'status') {
    h += '<div class="panel"><div class="seg">' +
      ['open', 'doing', 'done'].map(function (s) {
        return '<button type="button" data-s="' + s + '" class="' + (s === t.status ? 'on' : '') + '">' + LABEL[s] + '</button>';
      }).join('') +
      '</div><div class="actions"><button class="btn" data-act="close" type="button">Cancel</button>' +
      '<button class="btn primary" data-act="save-status" type="button">Update</button></div></div>';
  }
  if (o === 'note') {
    h += '<div class="panel">' +
      (ns.length ? '<ul class="notes">' + ns.map(function (n) {
        return '<li>' + esc(n.note) + '<div class="by">' + esc(n.person) + (n.when ? ' · ' + esc(n.when) : '') + '</div></li>';
      }).join('') + '</ul>' : '') +
      '<label class="f">New note (optional)</label><textarea class="inp" maxlength="500" data-note></textarea>' +
      '<div class="actions"><button class="btn" data-act="close" type="button">Close</button>' +
      '<button class="btn primary" data-act="save-note" type="button">Save note</button></div></div>';
  }
  return h + '</article>';
}

function listHTML(tasks, showOwner) {
  var active = tasks.filter(function (t) { return t.status !== 'done'; }).sort(byDueThenSort);
  var done = tasks.filter(function (t) { return t.status === 'done'; }).sort(byDueThenSort);
  var h = active.map(function (t) { return taskHTML(t, showOwner); }).join('');
  if (done.length) {
    h += '<details class="done-group"' + (active.length ? '' : ' open') + '><summary>Completed (' + done.length + ')</summary>' +
      done.map(function (t) { return taskHTML(t, showOwner); }).join('') + '</details>';
  }
  return h;
}

function studentHTML() {
  var c = counts(state.tasks);
  var h = '<div class="progress"><div class="row"><h2>My tasks</h2><span class="muted">' +
    c.done + ' of ' + c.total + ' completed</span></div>' + barHTML(c) + '</div>';
  if (!state.tasks.length) return h + '<div class="empty">No tasks yet. Check back soon.</div>';
  return h + listHTML(state.tasks, false);
}

function teacherHTML() {
  var students = state.students.slice();
  // Include owners that are on tasks but no longer on the roster, so nothing hides.
  state.tasks.forEach(function (t) { if (t.owner && students.indexOf(t.owner) < 0) students.push(t.owner); });
  var h = '<div class="tools">';

  h += '<div class="box"><h3>Add a task</h3><form id="addForm" autocomplete="off">' +
    '<div class="grid2">' +
      '<div><label class="f" for="addOwner">For</label><select class="inp" id="addOwner">' +
        '<option value="">Choose a student</option><option value="__ALL__">All students (' + state.students.length + ')</option>' +
        state.students.map(function (n) { return '<option>' + esc(n) + '</option>'; }).join('') + '</select></div>' +
      '<div><label class="f" for="addDue">Due (optional)</label><input class="inp" type="date" id="addDue"></div>' +
    '</div>' +
    '<label class="f" for="addTask">Task</label><input class="inp" id="addTask" maxlength="300" placeholder="e.g., Turn in timesheet">' +
    '<label class="f" for="addSection">Category (optional)</label><input class="inp" id="addSection" maxlength="40" placeholder="e.g., Work site, Class, Paperwork">' +
    '<div class="actions"><button class="btn primary" type="submit" id="addBtn">Add task</button></div>' +
    '</form></div>';

  h += '<div class="box"><h3>Students</h3>';
  if (!students.length) {
    h += '<p class="muted">No students yet. Add first names on the Students tab of the sheet, then tap Refresh.</p>';
  } else {
    h += '<div class="roster">' + students.map(function (n) {
      var c = counts(state.tasks.filter(function (t) { return t.owner === n; }));
      return '<button type="button" class="chip' + (ui.filterOwner === n ? ' on' : '') + '" data-owner="' + esc(n) + '"><b>' + esc(n) + '</b>' +
        '<small>' + c.done + '/' + c.total + ' done' + (c.doing ? ' · ' + c.doing + ' in progress' : '') + '</small>' + barHTML(c) + '</button>';
    }).join('') + '</div>';
  }
  h += '</div></div>';

  h += '<div class="filters"><select class="inp" id="fOwner"><option value="">All students</option>' +
    students.map(function (n) { return '<option' + (ui.filterOwner === n ? ' selected' : '') + '>' + esc(n) + '</option>'; }).join('') + '</select>' +
    '<select class="inp" id="fStatus"><option value="">Any status</option>' +
    ['open', 'doing', 'done'].map(function (s) { return '<option value="' + s + '"' + (ui.filterStatus === s ? ' selected' : '') + '>' + LABEL[s] + '</option>'; }).join('') +
    '</select></div>';

  var tasks = state.tasks.filter(function (t) {
    return (!ui.filterOwner || t.owner === ui.filterOwner) && (!ui.filterStatus || t.status === ui.filterStatus);
  });
  if (!tasks.length) return h + '<div class="empty">' + (state.tasks.length ? 'No tasks match these filters.' : 'No tasks yet. Add one above.') + '</div>';

  var owners = [];
  tasks.forEach(function (t) { if (owners.indexOf(t.owner) < 0) owners.push(t.owner); });
  owners.sort(function (a, b) { return a.localeCompare(b); });
  owners.forEach(function (o) {
    var mine = tasks.filter(function (t) { return t.owner === o; });
    var c = counts(mine);
    h += '<h2 class="owner">' + esc(o || '(no student)') + ' <span class="muted">' + c.done + '/' + c.total + ' done</span></h2>' + listHTML(mine, false);
  });
  return h;
}

/* ======================= EVENTS ======================= */
function wire() {
  var b = $('board');
  b.querySelectorAll('.task').forEach(function (el) {
    var id = el.getAttribute('data-id');
    var pick = null;
    el.querySelectorAll('.seg button').forEach(function (btn) {
      if (btn.classList.contains('on')) pick = btn.getAttribute('data-s');
      btn.onclick = function () {
        el.querySelectorAll('.seg button').forEach(function (x) { x.classList.remove('on'); });
        btn.classList.add('on'); pick = btn.getAttribute('data-s');
      };
    });
    el.querySelectorAll('[data-act]').forEach(function (btn) {
      btn.onclick = function () {
        var act = btn.getAttribute('data-act');
        if (act === 'panel-status') { ui.open[id] = ui.open[id] === 'status' ? '' : 'status'; render(); }
        else if (act === 'panel-note') { ui.open[id] = ui.open[id] === 'note' ? '' : 'note'; render(); }
        else if (act === 'close') { ui.open[id] = ''; render(); }
        else if (act === 'save-status') saveStatus(id, pick);
        else if (act === 'save-note') saveNote(id, el.querySelector('[data-note]').value);
      };
    });
  });
  b.querySelectorAll('.chip').forEach(function (c) {
    c.onclick = function () { var o = c.getAttribute('data-owner'); ui.filterOwner = ui.filterOwner === o ? '' : o; render(); };
  });
  if ($('fOwner')) $('fOwner').onchange = function () { ui.filterOwner = this.value; render(); };
  if ($('fStatus')) $('fStatus').onchange = function () { ui.filterStatus = this.value; render(); };
  if ($('addForm')) $('addForm').onsubmit = addTask;
}

function findTask(id) { return state.tasks.filter(function (t) { return t.id === id; })[0]; }

function saveStatus(id, next) {
  var t = findTask(id);
  if (!t || !next) return;
  if (next === t.status) { ui.open[id] = ''; render(); return; }
  var who = state.me.role === 'teacher' ? ' for ' + t.owner : '';
  confirmBox('Mark "' + t.task + '"' + who + ' as ' + LABEL[next] + '?').then(function (yes) {
    if (!yes) return;
    // Optimistic: show it now, undo if the save fails.
    var old = { status: t.status, by: t.updated_by, at: t.updated_at };
    t.status = next; t.updated_by = state.me.name; t.updated_at = 'just now'; ui.open[id] = '';
    render();
    authed({ action: 'status', id: id, status: next }).then(function (d) {
      setState(d.state, false); toast('Saved: ' + LABEL[next]);
    }).catch(function (err) {
      t.status = old.status; t.updated_by = old.by; t.updated_at = old.at; render();
      toast('Nothing was saved. ' + err.message, true);
    });
  });
}

function saveNote(id, text) {
  text = String(text || '').trim();
  if (!text) { toast('Type a note first.', true); return; }
  var temp = { task_id: id, person: state.me.name, note: text, when: 'just now' };
  state.notes.push(temp); render();
  authed({ action: 'note', id: id, note: text }).then(function (d) {
    setState(d.state, false); toast('Note saved');
  }).catch(function (err) {
    state.notes.splice(state.notes.indexOf(temp), 1); render();
    toast('Nothing was saved. ' + err.message, true);
  });
}

function addTask(e) {
  e.preventDefault();
  var owner = $('addOwner').value, task = $('addTask').value.trim();
  if (!owner) { toast('Choose a student.', true); return; }
  if (!task) { toast('Type the task.', true); return; }
  var params = { action: 'add', owner: owner, task: task, due: $('addDue').value, section: $('addSection').value.trim() };
  var go = owner === '__ALL__' ? confirmBox('Add "' + task + '" for all ' + state.students.length + ' students?') : Promise.resolve(true);
  go.then(function (yes) {
    if (!yes) return;
    $('addBtn').disabled = true; $('addBtn').textContent = 'Adding…';
    authed(params).then(function (d) {
      setState(d.state, false);
      toast('Added ' + d.added.length + ' task' + (d.added.length === 1 ? '' : 's'));
    }).catch(function (err) {
      toast('Nothing was saved. ' + err.message, true);
      $('addBtn').disabled = false; $('addBtn').textContent = 'Add task';
    });
  });
}

/* ======================= START ======================= */
$('build').textContent = BUILD;
(function start() {
  creds = sget('session', 'rwp.creds') || sget('local', 'rwp.creds');
  if (!creds) { showSignin(); return; }
  var cached = creds.remember ? sget('local', boardKey(creds.person)) : null;
  if (cached) setState(cached, true);
  else if (SEED.length) setState({ me: { name: creds.person, role: 'student' }, tasks: SEED, notes: [] }, true);
  refresh(false).then(function () {
    if (!state && creds) showSignin('Could not reach the server. Try again in a minute.');
  });
})();
</script>
