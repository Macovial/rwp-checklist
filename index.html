<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RWP Checklist</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232e7d32'/%3E%3Cpath d='M9 16.5l5 5 9-11' fill='none' stroke='white' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<meta charset="utf-8">
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --ink:#1b1f24; --muted:#5d6670; --line:#dde1e6;
  --accent:#1f5fae; --accent-ink:#fff;
  --open:#c62828; --open-bg:#fdecec;
  --doing:#d96c00; --doing-bg:#fff2e2;
  --done:#2e7d32; --done-bg:#e8f5e9;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121417; --card:#1c1f24; --ink:#e8eaed; --muted:#9aa3ad; --line:#2e333a;
    --accent:#5b9bf0; --accent-ink:#0b1320;
    --open:#ff6b6b; --open-bg:#3a1d1f;
    --doing:#ffa94d; --doing-bg:#3a2a17;
    --done:#69c46d; --done-bg:#1b3320;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{width:100%;max-width:820px;margin:0 auto;padding:0 16px}

header{background:var(--card);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:12px;min-height:56px}
.brand{font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--done);display:inline-grid;place-items:center}
.brand i::after{content:"";width:9px;height:5px;border:solid #fff;border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) translate(1px,-1px)}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.who b{color:var(--ink)}
.btn{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.small{padding:5px 10px;font-size:13px}
a.btn{text-decoration:none;display:inline-block}
@media (max-width:480px){.hi{display:none}.brand{font-size:16px}.who{gap:6px}.btn.small{padding:5px 8px}}
@media (max-width:400px){#whoName{display:none}.brand{font-size:15px}.brand i{display:none}}
.btn:disabled{opacity:.55;cursor:default}

main{flex:1;padding:20px 0 32px}
.hidden{display:none!important}

/* sign in */
#signin{display:grid;place-items:center;min-height:60vh}
.signcard{position:relative;width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 22px 22px;box-shadow:var(--shadow)}
.flag{position:absolute;top:-14px;left:18px;background:var(--open);color:#fff;font-weight:700;font-size:13px;padding:4px 10px;border-radius:999px;animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){.flag{animation:none}}
.signcard h1{margin:0 0 4px;font-size:22px}
.signcard p{margin:0 0 16px;color:var(--muted);font-size:14px}
label.f{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
.inp{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.inp:focus{outline:2px solid var(--accent);outline-offset:1px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;margin:14px 0 16px;color:var(--muted)}
.err{color:var(--open);font-size:14px;min-height:20px;margin-top:10px}

/* board */
.banner{background:var(--doing-bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px;margin-bottom:14px}
.progress{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
.progress .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.progress h2{margin:0;font-size:18px}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px;display:flex}
.bar span{display:block;height:100%}
.bar .d{background:var(--done)}
.muted{color:var(--muted);font-size:14px}

.task{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--open);border-radius:10px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.task.done{border-left-color:var(--done)}
.task .top{display:flex;gap:10px;align-items:flex-start}
.task .txt{flex:1;font-weight:600;word-wrap:break-word;overflow-wrap:anywhere}
.task.done .txt{color:var(--muted)}
.pill{flex:none;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.open{background:var(--open-bg);color:var(--open)}
.pill.done{background:var(--done-bg);color:var(--done)}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted);margin-top:6px}
.meta .late{color:var(--open);font-weight:700}
.tag{border:1px solid var(--line);border-radius:6px;padding:0 6px}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.panel{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:92px;border:2px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 6px;font-size:14px;font-weight:600}
.seg button[data-s=open].on{border-color:var(--open);background:var(--open-bg);color:var(--open)}
.seg button[data-s=done].on{border-color:var(--done);background:var(--done-bg);color:var(--done)}
textarea.inp{min-height:70px;resize:vertical}
details.done-group>summary{cursor:pointer;color:var(--muted);font-weight:600;margin:18px 0 10px}
.empty{text-align:center;color:var(--muted);padding:30px 10px;background:var(--card);border:1px dashed var(--line);border-radius:12px}

/* teacher */
.tools{display:grid;gap:12px;margin-bottom:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.box h3{margin:0 0 10px;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chip{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px}
.chip.on{outline:2px solid var(--accent)}
.chip b{display:block;font-size:14px}
.chip .bar{height:6px;margin-top:6px}
.chip small{color:var(--muted);font-size:12px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters select{width:auto;flex:1;min-width:140px}
h2.owner{font-size:16px;margin:22px 0 8px;display:flex;gap:8px;align-items:baseline}

dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:20px;max-width:min(92vw,380px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog p{margin:0 0 16px}
dialog .actions{justify-content:flex-end}

#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100vw - 32px);box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:10}
#toast.bad{background:var(--open);color:#fff}

footer{border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;gap:8px;padding-top:10px;padding-bottom:14px;flex-wrap:wrap}

/* date picker */
.datewrap{position:relative}
.datebtn{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;cursor:pointer}
.datebtn .ph{color:var(--muted)}
.datebtn svg{flex:none;color:var(--muted)}
.cal{position:absolute;z-index:6;top:calc(100% + 6px);right:0;width:292px;max-width:calc(100vw - 32px);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:0 8px 28px rgba(0,0,0,.22)}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.calnav{border:0;background:none;font-size:22px;line-height:1;width:36px;height:36px;border-radius:8px}
.calnav:hover{background:var(--bg)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.calgrid .dow{font-size:12px;color:var(--muted);padding:4px 0}
.day{border:0;background:none;height:36px;border-radius:8px;font-size:14px}
.day:hover{background:var(--bg)}
.day.tdy{outline:1px solid var(--accent)}
.day.sel{background:var(--accent);color:var(--accent-ink);font-weight:700}
.calfoot{display:flex;justify-content:space-between;margin-top:8px}
.pill.sched{background:var(--line);color:var(--muted)}
.task.sched{border-left-color:var(--muted);opacity:.85}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.rep{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.rep:first-of-type{border-top:0}
.rep b{display:block}
.rep small{color:var(--muted);font-size:13px}
.gbtn{display:flex;justify-content:center;min-height:44px;margin:6px 0 4px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand"><i></i>RWP Checklist</div>
    <div class="who hidden" id="who">
      <span><span class="hi">Hi, </span><b id="whoName"></b></span>
      <button class="btn small" id="refreshBtn" type="button">Refresh</button>
      <button class="btn small" id="logoutBtn" type="button">Log out</button>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <section id="signin">
      <div class="signcard" id="gate">
        <h1>RWP Dashboard</h1>
        <p id="gateMsg">Sign in with your school Google account.</p>
        <div id="gbtn" class="gbtn"></div>
        <button class="btn hidden" style="width:100%;margin-top:12px" type="button" id="retryBtn">Try again</button>
        <div class="err" id="signErr" role="alert"></div>
      </div>
    </section>

    <section id="board" class="hidden"></section>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>Changes save to the RWP sheet.</span>
    <span id="build"></span>
  </div>
</footer>

<dialog id="confirmDlg">
  <p id="confirmMsg"></p>
  <div class="actions">
    <button class="btn" type="button" id="confirmNo">Cancel</button>
    <button class="btn primary" type="button" id="confirmYes">Yes, save</button>
  </div>
</dialog>
<div id="toast" class="hidden" role="status"></div>

<script>
/* ======================= CONFIG ======================= */
var BUILD = 'build 2026-09-25.6';

// OAuth Client ID from Google Cloud Console. Must match CLIENT_ID in Code.gs.
var CLIENT_ID = '1059378920553-58nqgf0vv0ukn8rvpcefebhbs020tlsn.apps.googleusercontent.com';
// Apps Script web app (Deploy > Manage deployments). Ends in /exec.
var EXEC_URL = 'https://script.google.com/macros/s/AKfycby7akb8-ue3WiYNBuIkIDaZTbRuyZm0O3LKRvy8o6H2ZDLOIplFDUgBJycny5CwsViFlA/exec';

/* ======================= STATE ======================= */
var LABEL = { open: 'Not Started', done: 'Completed' };
var me = null;             // { name, role, email } from Google sign-in
var idt = '';              // Google ID token (about 1 hour); kept for this tab only
var state = null;          // last load_ reply
var ui = { open: {}, filterOwner: '', filterStatus: '', stale: false, draft: emptyDraft() };
function emptyDraft() { return { owner: '', task: '', section: '', due: '', start: '', repeat: '', ends: '' }; }
var REPEATS = { '': 'Does not repeat', weekdays: 'Every weekday (Mon–Fri)', weekly: 'Every week', biweekly: 'Every 2 weeks', monthly: 'Every month' };
function isSched(t) { return !!(t.start && t.start > ((state && state.today) || today())); }

/* ======================= SERVER CALLS ======================= */
// Plain fetch with NO cookies (credentials: 'omit'). Apps Script allows this (Access-Control-Allow-Origin: *).
// Sending no Google cookies keeps multi-account browsers from being rerouted to the wrong account.
// Identity comes only from the Google ID token, which the server checks with Google.
function call(params) {
  var p = Object.assign({ idt: idt }, params);
  var q = new URLSearchParams(p); q.set('_', Date.now());
  var ctl = window.AbortController ? new AbortController() : null;
  var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 25000);
  return fetch(EXEC_URL + '?' + q.toString(), { method: 'GET', credentials: 'omit', cache: 'no-store', redirect: 'follow', signal: ctl ? ctl.signal : undefined })
    .then(function (r) {
      if (!r.ok) throw new Error('The server answered with an error (' + r.status + ').');
      return r.json().catch(function () { throw new Error('The server sent an unexpected reply. Is the deployment set to Anyone?'); });
    }, function (e) {
      throw new Error(e && e.name === 'AbortError' ? 'No answer from the server. Check your connection.' : 'Could not reach the server.');
    })
    .then(function (d) {
      if (d && d.ok) return d;
      throw new Error((d && d.error) || 'Unknown error');
    })
    .finally(function () { clearTimeout(timer); });
}

/* ======================= HELPERS ======================= */
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function today() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function prettyDue(s) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); if (!m) return s;
  return new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
}
var toastTimer;
function toast(msg, bad) {
  var t = $('toast'); t.textContent = msg; t.className = bad ? 'bad' : '';
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.className = 'hidden'; }, bad ? 6000 : 2500);
}
function confirmBox(msg) {
  var dlg = $('confirmDlg');
  $('confirmMsg').textContent = msg;
  return new Promise(function (resolve) {
    function close(v) { $('confirmYes').onclick = $('confirmNo').onclick = null; dlg.close(); resolve(v); }
    $('confirmYes').onclick = function () { close(true); };
    $('confirmNo').onclick = function () { close(false); };
    dlg.oncancel = function (e) { e.preventDefault(); close(false); };
    if (dlg.showModal) dlg.showModal(); else resolve(true);
  });
}
function byDueThenSort(a, b) {
  var da = a.due || '9999', db = b.due || '9999';
  if (da !== db) return da < db ? -1 : 1;
  return (a.sort || 0) - (b.sort || 0);
}
function counts(tasks) {
  tasks = tasks.filter(function (t) { return !isSched(t); });
  var c = { open: 0, done: 0, total: tasks.length };
  tasks.forEach(function (t) { c[t.status === 'done' ? 'done' : 'open']++; });
  return c;
}
function barHTML(c) {
  if (!c.total) return '<div class="bar"></div>';
  return '<div class="bar"><span class="d" style="width:' + (100 * c.done / c.total) + '%"></span></div>';
}

/* ======================= SIGN IN ======================= */
function showGate(msg, err, showRetry) {
  $('signin').classList.remove('hidden');
  $('board').classList.add('hidden');
  $('who').classList.add('hidden');
  $('gateMsg').textContent = msg || '';
  $('signErr').textContent = err || '';
  $('retryBtn').classList.toggle('hidden', !showRetry);
  $('gbtn').classList.remove('hidden');
}

function tokenExp(t) {   // seconds since epoch, or 0
  try {
    var b = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    return JSON.parse(atob(b + '==='.slice((b.length + 3) % 4))).exp || 0;
  } catch (e) { return 0; }
}
function saveToken(t) { idt = t; try { sessionStorage.setItem('rwp.idt', t); } catch (e) {} }
// After Log out, stop automatic sign-in on this device until someone taps the button.
function loggedOut() { try { return localStorage.getItem('rwp.loggedOut') === '1'; } catch (e) { return false; } }
function setLoggedOut(v) { try { if (v) localStorage.setItem('rwp.loggedOut', '1'); else localStorage.removeItem('rwp.loggedOut'); } catch (e) {} }
var SWITCH_HINT = 'To use a different account, tap Sign in with Google, then Use another account.';
function clearToken() { idt = ''; try { sessionStorage.removeItem('rwp.idt'); } catch (e) {} }

var gisReady = false;
function initGoogle(tries) {
  if (window.google && google.accounts && google.accounts.id) {
    google.accounts.id.initialize({
      client_id: CLIENT_ID,
      callback: function (resp) { setLoggedOut(false); saveToken(resp.credential); whoami(); },
      auto_select: !loggedOut(),
      hd: 'csdeagles.net',
      itp_support: true,
      use_fedcm_for_prompt: true
    });
    google.accounts.id.renderButton($('gbtn'), { theme: 'filled_blue', size: 'large', text: 'signin_with', shape: 'pill' });
    gisReady = true;
    return;
  }
  if ((tries || 0) > 100) { showGate('', 'Google sign-in did not load. Check your connection and reload.', true); return; }
  setTimeout(function () { initGoogle((tries || 0) + 1); }, 100);
}

function askSignIn(msg) {
  clearToken(); state = null;
  showGate(msg || 'Sign in with your school Google account.');
  if (gisReady && !loggedOut()) { try { google.accounts.id.prompt(); } catch (e) {} }
}

function whoami() {
  showGate('Checking your account…');
  $('gbtn').classList.add('hidden');
  call({ action: 'whoami' }).then(function (d) {
    me = d.me;
    return refresh(false);
  }).catch(function (err) {
    if (/^SIGNIN:/.test(err.message)) { askSignIn(err.message.replace(/^SIGNIN:\s*/, '')); return; }
    clearToken();
    showGate('Sign in with your school Google account.', err.message);
    try { google.accounts.id.disableAutoSelect(); } catch (e) {}
  });
}

function start() {
  if (/^PASTE_/.test(CLIENT_ID)) { showGate('', 'Sign-in is not set up yet (CLIENT_ID is missing).'); $('gbtn').classList.add('hidden'); return; }
  initGoogle(0);
  var t = ''; try { t = sessionStorage.getItem('rwp.idt') || ''; } catch (e) {}
  if (t && tokenExp(t) * 1000 > Date.now() + 60000) { saveToken(t); whoami(); }
  else if (loggedOut()) { showGate('You are logged out. ' + SWITCH_HINT); }
  else { showGate('Sign in with your school Google account.'); var w = setInterval(function () { if (gisReady) { clearInterval(w); try { google.accounts.id.prompt(); } catch (e) {} } }, 150); }
}

$('retryBtn').onclick = function () { location.reload(); };
// Log out of the checklist only. Google stays signed in on this browser, but
// auto sign-in is turned off so the next person has to pick an account.
$('logoutBtn').onclick = function () {
  try { google.accounts.id.disableAutoSelect(); } catch (e) {}
  ui = { open: {}, filterOwner: '', filterStatus: '', stale: false, draft: emptyDraft() };
  clearToken(); state = null; me = null;
  setLoggedOut(true);
  try { google.accounts.id.cancel(); } catch (e) {}
  showGate('You are logged out. ' + SWITCH_HINT);
};
$('refreshBtn').onclick = function () { refresh(true); };

/* ======================= LOAD ======================= */
function setState(d) {
  state = { me: d.me, tasks: d.tasks || [], notes: d.notes || [],
            students: d.students || (state && state.students) || [],
            missingEmail: d.missingEmail || (state && state.missingEmail) || [],
            repeats: d.repeats || (state && state.repeats) || [], today: d.today || today(), stamp: d.stamp };
  ui.stale = false;
  render();
}

function refresh(announce) {
  return call({ action: 'load' }).then(function (d) {
    setState(d);
    if (announce) toast('Up to date');
  }).catch(function (err) {
    if (/^SIGNIN:/.test(err.message)) { askSignIn(err.message.replace(/^SIGNIN:\s*/, '')); return; }
    if (/not on the RWP list/i.test(err.message)) { state = null; whoami(); return; }
    if (!state) { showGate('', err.message, true); return; }
    ui.stale = true; render();
    toast('Could not refresh: ' + err.message, true);
  });
}

/* ======================= RENDER ======================= */
function render() {
  if (!state) return;
  $('signin').classList.add('hidden');
  $('board').classList.remove('hidden');
  $('who').classList.remove('hidden');
  $('whoName').textContent = state.me.name;
  var b = $('board');
  var html = ui.stale ? '<div class="banner">Could not refresh. What you see may be out of date.</div>' : '';
  html += state.me.role === 'teacher' ? teacherHTML() : studentHTML();
  b.innerHTML = html;
  wire();
}


function taskHTML(t, showOwner) {
  var late = t.status !== 'done' && t.due && t.due < today();
  var sched = isSched(t);
  var o = ui.open[t.id] || '';
  var h = '<article class="task ' + (sched ? 'sched' : t.status) + '" data-id="' + esc(t.id) + '">' +
    '<div class="top"><div class="txt">' + esc(t.task) + '</div>' + (sched ? '<span class="pill sched">Scheduled</span>' : '<span class="pill ' + t.status + '">' + LABEL[t.status] + '</span>') + '</div>' +
    '<div class="meta">' +
      (showOwner ? '<span><b>' + esc(t.owner) + '</b></span>' : '') +
      (t.section && t.section !== 'General' ? '<span class="tag">' + esc(t.section) + '</span>' : '') +
      (sched ? '<span>Shows ' + esc(prettyDue(t.start)) + '</span>' : '') +
      (t.due ? '<span class="' + (late ? 'late' : '') + '">' + (late ? 'Overdue · ' : 'Due ') + esc(prettyDue(t.due)) + '</span>' : '') +
      (t.updated_by ? '<span>Updated by ' + esc(t.updated_by) + (t.updated_at ? ', ' + esc(t.updated_at) : '') + '</span>' : '') +
    '</div>' +
    (sched ? '' : '<div class="actions">' +
      '<button class="btn small" data-act="panel-status" type="button">' + (t.status === 'done' ? 'Reopen' : 'Start') + '</button>' +
    '</div>');
  if (o === 'status') {
    h += '<div class="panel"><div class="seg">' +
      ['open', 'done'].map(function (s) {
        return '<button type="button" data-s="' + s + '" class="' + (s === t.status ? 'on' : '') + '">' + LABEL[s] + '</button>';
      }).join('') +
      '</div><div class="actions"><button class="btn" data-act="close" type="button">Cancel</button>' +
      '<button class="btn primary" data-act="save-status" type="button">Update</button></div></div>';
  }
  return h + '</article>';
}

function listHTML(tasks, showOwner) {
  var later = tasks.filter(isSched).sort(function (a, b) { return a.start < b.start ? -1 : a.start > b.start ? 1 : byDueThenSort(a, b); });
  tasks = tasks.filter(function (t) { return !isSched(t); });
  var active = tasks.filter(function (t) { return t.status !== 'done'; }).sort(byDueThenSort);
  var done = tasks.filter(function (t) { return t.status === 'done'; }).sort(byDueThenSort);
  var h = active.map(function (t) { return taskHTML(t, showOwner); }).join('');
  if (done.length) {
    h += '<details class="done-group"' + (active.length ? '' : ' open') + '><summary>Completed (' + done.length + ')</summary>' +
      done.map(function (t) { return taskHTML(t, showOwner); }).join('') + '</details>';
  }
  if (later.length) {
    h += '<details class="done-group"><summary>Scheduled (' + later.length + ')</summary>' +
      later.map(function (t) { return taskHTML(t, showOwner); }).join('') + '</details>';
  }
  return h;
}

function studentHTML() {
  var c = counts(state.tasks);
  var h = '<div class="progress"><div class="row"><h2>My tasks</h2><span class="muted">' +
    c.done + ' of ' + c.total + ' completed</span></div>' + barHTML(c) + '</div>';
  if (!state.tasks.length) return h + '<div class="empty">No tasks yet. Check back soon.</div>';
  return h + listHTML(state.tasks, false);
}

function teacherHTML() {
  var students = state.students.slice();
  // Include owners that are on tasks but no longer on the roster, so nothing hides.
  state.tasks.forEach(function (t) { if (t.owner && students.indexOf(t.owner) < 0) students.push(t.owner); });
  var h = '<div class="tools">';

  var d = ui.draft;
  h += '<div class="box"><h3>Add a task</h3><form id="addForm" autocomplete="off">' +
    '<div class="grid2">' +
      '<div><label class="f" for="addOwner">For</label><select class="inp" id="addOwner">' +
        '<option value="">Choose a student</option><option value="__ALL__"' + (d.owner === '__ALL__' ? ' selected' : '') + '>All students (' + state.students.length + ')</option>' +
        state.students.map(function (n) { return '<option' + (d.owner === n ? ' selected' : '') + '>' + esc(n) + '</option>'; }).join('') + '</select></div>' +
      '<div><label class="f" for="addSection">Category (optional)</label><input class="inp" id="addSection" maxlength="40" placeholder="e.g., Work site, Paperwork" value="' + esc(d.section) + '"></div>' +
    '</div>' +
    '<label class="f" for="addTask">Task</label><input class="inp" id="addTask" maxlength="300" placeholder="e.g., Turn in timesheet" value="' + esc(d.task) + '">' +
    '<div class="grid2">' +
      dateField('start', 'Show starting', 'Today', 'Today') +
      dateField('due', 'Due (optional)', 'Pick a date', 'No due date') +
    '</div>' +
    '<div class="grid2">' +
      '<div><label class="f" for="addRepeat">Repeat</label><select class="inp" id="addRepeat">' +
        Object.keys(REPEATS).map(function (k) { return '<option value="' + k + '"' + (d.repeat === k ? ' selected' : '') + '>' + REPEATS[k] + '</option>'; }).join('') +
      '</select></div>' +
      (d.repeat ? dateField('ends', 'Ends (optional)', 'Never', 'Never') : '<div></div>') +
    '</div>' +
    '<div class="hint">' + (d.repeat
      ? 'A new copy shows on each repeat day' + (d.due ? ', due ' + dayGap(d.start || today(), d.due) + ' after it shows' : '') + '. Students see only the copies that have shown.'
      : 'Students won&#39;t see this task until its show date.') + '</div>' +
    '<div class="actions"><button class="btn primary" type="submit" id="addBtn">' + (d.repeat ? 'Add repeating task' : 'Add task') + '</button></div>' +
    '</form></div>';

  if (state.repeats && state.repeats.length) {
    h += '<div class="box"><h3>Repeating tasks</h3>' + state.repeats.map(function (r) {
      var who = r.owner === '__ALL__' ? 'All students' : r.owner;
      return '<div class="rep"><div><b>' + esc(r.task) + '</b><small>' + esc(who) + ' · ' + esc(r.label) +
        (r.dueAfter !== '' && r.dueAfter != null ? ' · due ' + (r.dueAfter === 0 ? 'same day' : r.dueAfter + ' day' + (r.dueAfter === 1 ? '' : 's') + ' later') : '') +
        (r.next ? ' · next shows ' + esc(prettyDue(r.next)) : ' · no more dates') +
        (r.ends ? ' · ends ' + esc(prettyDue(r.ends)) : '') + '</small></div>' +
        '<button class="btn small" type="button" data-stop="' + esc(r.id) + '" data-name="' + esc(r.task) + '">Stop</button></div>';
    }).join('') + '</div>';
  }

  h += '<div class="box"><h3>Students</h3>';
  if (state.missingEmail && state.missingEmail.length) h += '<div class="banner">No email on the Students tab, so these students cannot sign in: ' + esc(state.missingEmail.join(', ')) + '</div>';
  if (!students.length) {
    h += '<p class="muted">No students yet. Add each student&#39;s first name and school email on the Students tab, then tap Refresh.</p>';
  } else {
    h += '<div class="roster">' + students.map(function (n) {
      var c = counts(state.tasks.filter(function (t) { return t.owner === n; }));
      return '<button type="button" class="chip' + (ui.filterOwner === n ? ' on' : '') + '" data-owner="' + esc(n) + '"><b>' + esc(n) + '</b>' +
        '<small>' + c.done + '/' + c.total + ' done</small>' + barHTML(c) + '</button>';
    }).join('') + '</div>';
  }
  h += '</div></div>';

  h += '<div class="filters"><select class="inp" id="fOwner"><option value="">All students</option>' +
    students.map(function (n) { return '<option' + (ui.filterOwner === n ? ' selected' : '') + '>' + esc(n) + '</option>'; }).join('') + '</select>' +
    '<select class="inp" id="fStatus"><option value="">Any status</option>' +
    ['open', 'done'].map(function (s) { return '<option value="' + s + '"' + (ui.filterStatus === s ? ' selected' : '') + '>' + LABEL[s] + '</option>'; }).join('') +
    '</select></div>';

  var tasks = state.tasks.filter(function (t) {
    return (!ui.filterOwner || t.owner === ui.filterOwner) && (!ui.filterStatus || t.status === ui.filterStatus);
  });
  if (!tasks.length) return h + '<div class="empty">' + (state.tasks.length ? 'No tasks match these filters.' : 'No tasks yet. Add one above.') + '</div>';

  var owners = [];
  tasks.forEach(function (t) { if (owners.indexOf(t.owner) < 0) owners.push(t.owner); });
  owners.sort(function (a, b) { return a.localeCompare(b); });
  owners.forEach(function (o) {
    var mine = tasks.filter(function (t) { return t.owner === o; });
    var c = counts(mine);
    h += '<h2 class="owner">' + esc(o || '(no student)') + ' <span class="muted">' + c.done + '/' + c.total + ' done</span></h2>' + listHTML(mine, false);
  });
  return h;
}

/* ======================= EVENTS ======================= */
function wire() {
  var b = $('board');
  b.querySelectorAll('.task').forEach(function (el) {
    var id = el.getAttribute('data-id');
    var pick = null;
    el.querySelectorAll('.seg button').forEach(function (btn) {
      if (btn.classList.contains('on')) pick = btn.getAttribute('data-s');
      btn.onclick = function () {
        el.querySelectorAll('.seg button').forEach(function (x) { x.classList.remove('on'); });
        btn.classList.add('on'); pick = btn.getAttribute('data-s');
      };
    });
    el.querySelectorAll('[data-act]').forEach(function (btn) {
      btn.onclick = function () {
        var act = btn.getAttribute('data-act');
        if (act === 'panel-status') { ui.open[id] = ui.open[id] === 'status' ? '' : 'status'; render(); }
        else if (act === 'close') { ui.open[id] = ''; render(); }
        else if (act === 'save-status') saveStatus(id, pick);
      };
    });
  });
  b.querySelectorAll('.chip').forEach(function (c) {
    c.onclick = function () { var o = c.getAttribute('data-owner'); ui.filterOwner = ui.filterOwner === o ? '' : o; render(); };
  });
  if ($('fOwner')) $('fOwner').onchange = function () { ui.filterOwner = this.value; render(); };
  if ($('fStatus')) $('fStatus').onchange = function () { ui.filterStatus = this.value; render(); };
  if ($('addForm')) {
    $('addForm').onsubmit = addTask;
    $('addOwner').onchange = function () { ui.draft.owner = this.value; };
    $('addTask').oninput = function () { ui.draft.task = this.value; };
    $('addSection').oninput = function () { ui.draft.section = this.value; };
    ['start', 'due', 'ends'].forEach(function (k) {
      var b = $('db_' + k); if (b) b.onclick = function (e) { e.stopPropagation(); toggleCal(k); };
    });
    $('addRepeat').onchange = function () { ui.draft.repeat = this.value; if (!this.value) ui.draft.ends = ''; render(); };
    document.querySelectorAll('[data-stop]').forEach(function (b) { b.onclick = function () { stopRepeat(b.getAttribute('data-stop'), b.getAttribute('data-name')); }; });
  }
}

function findTask(id) { return state.tasks.filter(function (t) { return t.id === id; })[0]; }

function saveStatus(id, next) {
  var t = findTask(id);
  if (!t || !next) return;
  if (next === t.status) { ui.open[id] = ''; render(); return; }
  var who = state.me.role === 'teacher' ? ' for ' + t.owner : '';
  confirmBox('Mark "' + t.task + '"' + who + ' as ' + LABEL[next] + '?').then(function (yes) {
    if (!yes) return;
    // Optimistic: show it now, undo if the save fails.
    var old = { status: t.status, by: t.updated_by, at: t.updated_at };
    t.status = next; t.updated_by = state.me.name; t.updated_at = 'just now'; ui.open[id] = '';
    render();
    call({ action: 'status', id: id, status: next }).then(function (d) {
      setState(d.state, false); toast('Saved: ' + LABEL[next]);
    }).catch(function (err) {
      t.status = old.status; t.updated_by = old.by; t.updated_at = old.at; render();
      toast('Nothing was saved. ' + err.message.replace(/^SIGNIN:\s*/, ''), true);
      if (/^SIGNIN:/.test(err.message)) askSignIn(err.message.replace(/^SIGNIN:\s*/, ''));
    });
  });
}

function addTask(e) {
  e.preventDefault();
  var d = ui.draft, owner = $('addOwner').value, task = $('addTask').value.trim();
  if (!owner) { toast('Choose a student.', true); return; }
  if (!task) { toast('Type the task.', true); return; }
  var start = d.start || today();
  if (d.due && d.due < start) { toast('The due date is before the show date.', true); return; }
  if (d.repeat && d.ends && d.ends < start) { toast('The end date is before the first show date.', true); return; }
  var params = { action: 'add', owner: owner, task: task, due: d.due, start: d.start, repeat: d.repeat, ends: d.ends,
                 section: $('addSection').value.trim() };
  var whoTxt = owner === '__ALL__' ? 'all ' + state.students.length + ' students' : owner;
  var msg = d.repeat
    ? 'Repeat "' + task + '" for ' + whoTxt + ', ' + REPEATS[d.repeat].toLowerCase() + ', starting ' + prettyDue(start) + (d.ends ? ' until ' + prettyDue(d.ends) : '') + '?'
    : (owner === '__ALL__' || start > today() ? 'Add "' + task + '" for ' + whoTxt + (start > today() ? ', showing ' + prettyDue(start) : '') + '?' : '');
  var go = msg ? confirmBox(msg) : Promise.resolve(true);
  go.then(function (yes) {
    if (!yes) return;
    $('addBtn').disabled = true; $('addBtn').textContent = 'Adding…';
    call(params).then(function (r) {
      ui.draft = emptyDraft();
      setState(r.state, false);
      var n = (r.added || []).length;
      toast(r.repeatId ? 'Repeating task set' + (n ? ' (' + n + ' shown today)' : '') : start > today() ? 'Scheduled for ' + prettyDue(start) : 'Added ' + n + ' task' + (n === 1 ? '' : 's'));
    }).catch(function (err) {
      toast('Nothing was saved. ' + err.message.replace(/^SIGNIN:\s*/, ''), true);
      if (/^SIGNIN:/.test(err.message)) askSignIn(err.message.replace(/^SIGNIN:\s*/, ''));
      $('addBtn').disabled = false; $('addBtn').textContent = 'Add task';
    });
  });
}

function stopRepeat(id, name) {
  confirmBox('Stop repeating "' + name + '"? Copies already shown stay on students’ lists.').then(function (yes) {
    if (!yes) return;
    call({ action: 'stopRepeat', id: id }).then(function (r) { setState(r.state, false); toast('Stopped'); })
      .catch(function (err) { toast('Nothing was saved. ' + err.message.replace(/^SIGNIN:\s*/, ''), true); });
  });
}

function dayGap(a, b) {
  var n = Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  return n === 0 ? '0 days (same day)' : n + ' day' + (n === 1 ? '' : 's');
}

function dateField(key, label, emptyText, clearText) {
  var v = ui.draft[key] || '';
  return '<div><label class="f" for="db_' + key + '">' + label + '</label><div class="datewrap">' +
    '<button type="button" class="inp datebtn" id="db_' + key + '" data-clear="' + esc(clearText) + '" data-empty="' + esc(emptyText) + '">' +
      '<span id="dt_' + key + '" class="' + (v ? '' : 'ph') + '">' + (v ? esc(prettyDue(v)) : esc(emptyText)) + '</span>' +
      '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>' +
    '</button><div class="cal hidden" id="cal_' + key + '" role="dialog" aria-label="' + esc(label) + '"></div></div></div>';
}

/* ======================= DATE PICKER ======================= */
// Custom popup: the browser's own picker can't be opened from inside the Apps Script frame.
var calView = null;   // { y, m } month being shown
var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function ymd(y, m, d) { return y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0'); }

var calKey = '';
function toggleCal(key) {
  var c = $('cal_' + key), wasOpen = c && !c.classList.contains('hidden');
  closeCal();
  if (!c || wasOpen) return;
  calKey = key;
  var v = ui.draft[key] || (key === 'due' && ui.draft.start) || '', m = /^(\d{4})-(\d{2})-\d{2}$/.exec(v), now = new Date();
  calView = m ? { y: +m[1], m: +m[2] - 1 } : { y: now.getFullYear(), m: now.getMonth() };
  drawCal();
  c.classList.remove('hidden');
}
function closeCal() { document.querySelectorAll('.cal').forEach(function (c) { c.classList.add('hidden'); }); }

function drawCal() {
  var y = calView.y, m = calView.m, sel = ui.draft[calKey] || '', tdy = today();
  var min = calKey === 'start' ? tdy : (ui.draft.start || tdy);
  var first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
  var btn = $('db_' + calKey);
  var h = '<div class="calhead"><button type="button" class="calnav" data-nav="-1" aria-label="Previous month">‹</button>' +
          '<b>' + MONTHS[m] + ' ' + y + '</b>' +
          '<button type="button" class="calnav" data-nav="1" aria-label="Next month">›</button></div><div class="calgrid">' +
          ['S','M','T','W','T','F','S'].map(function (d) { return '<span class="dow">' + d + '</span>'; }).join('');
  for (var i = 0; i < first; i++) h += '<span></span>';
  for (var d = 1; d <= days; d++) {
    var v = ymd(y, m, d), off = v < min;
    h += '<button type="button" class="day' + (v === sel ? ' sel' : '') + (v === tdy ? ' tdy' : '') + '" data-day="' + v + '"' + (off ? ' disabled style="opacity:.3"' : '') + '>' + d + '</button>';
  }
  h += '</div><div class="calfoot"><button type="button" class="btn small" data-pick="today">Today</button>' +
       '<button type="button" class="btn small" data-pick="clear">' + esc(btn ? btn.getAttribute('data-clear') : 'Clear') + '</button></div>';
  var c = $('cal_' + calKey); c.innerHTML = h;
  c.onclick = function (e) {
    e.stopPropagation();
    var t = e.target.closest('button'); if (!t || t.disabled) return;
    if (t.dataset.nav) {
      calView.m += +t.dataset.nav;
      if (calView.m < 0) { calView.m = 11; calView.y--; }
      if (calView.m > 11) { calView.m = 0; calView.y++; }
      drawCal();
    } else if (t.dataset.day) setDate(calKey, t.dataset.day);
    else if (t.dataset.pick === 'today') setDate(calKey, today());
    else if (t.dataset.pick === 'clear') setDate(calKey, '');
  };
}

function setDate(key, v) {
  if (key === 'start' && v === today()) v = '';          // "today" is the default; store blank
  ui.draft[key] = v;
  closeCal();
  render();                                              // refreshes labels and the repeat hint
}
document.addEventListener('click', function (e) { if (!e.target.closest || !e.target.closest('.datewrap')) closeCal(); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeCal(); });

/* ======================= START ======================= */
$('build').textContent = BUILD;
start();
</script>
</body>
</html>
